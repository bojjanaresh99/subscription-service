name: Deploy Subscription Service to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: subscription-service

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Give execute permission
        run: chmod +x mvnw

      - name: Build Project
        run: ./mvnw clean package -DskipTests

      - name: Verify JAR
        run: ls -lh target/

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "subscription-service/target/*.jar"
          target: "/opt/subscription-service"

      - name: Restart Service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /opt/subscription-service
            sudo cp /opt/subscription-service/target/*.jar /opt/subscription-service/subscription-service.jar
            sudo systemctl restart subscription-service
            sudo systemctl status subscription-service --no-pager